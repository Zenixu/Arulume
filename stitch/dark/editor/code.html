<!DOCTYPE html>

<html class="dark" lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Arulume — Atur Peningkatan</title>
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Plus Jakarta Sans Font -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            bg: '#111214',
            surface: '#1B1C1F',
            'surface-2': '#25272B',
            border: '#2F3136',
            text: '#F7F6F3',
            'text-2': '#A4A7AE',
            accent: '#F5B83D',
            'on-accent': '#111214',
            'accent-text': '#F5B83D',
            success: '#6FCF97',
            danger: '#FF6B6B',
            warning: '#F2994A',
            // Material 3 aliases
            background: '#111214',
            'surface-dim': '#111214',
            'surface-container-lowest': '#111214',
            'surface-container-low': '#1B1C1F',
            'surface-container': '#1B1C1F',
            'surface-container-high': '#25272B',
            'surface-container-highest': '#2F3136',
            'surface-variant': '#25272B',
            outline: '#2F3136',
            'outline-variant': '#2F3136',
            'on-surface': '#F7F6F3',
            'on-background': '#F7F6F3',
            'on-surface-variant': '#A4A7AE',
            secondary: '#A4A7AE',
            'on-secondary': '#111214',
            'secondary-container': '#25272B',
            'on-secondary-container': '#F7F6F3',
            primary: '#F5B83D',
            'on-primary': '#111214',
            'primary-container': '#F5B83D',
            'on-primary-container': '#111214',
            'surface-tint': '#F5B83D',
            error: '#FF6B6B',
            'on-error': '#111214',
            'error-container': '#FF6B6B',
            'on-error-container': '#111214'
          },
          borderRadius: {
            sm: '12px',
            md: '16px',
            lg: '24px',
            full: '9999px',
            '2xl': '16px'
          },
          fontFamily: {
            headline: ["Plus Jakarta Sans", "sans-serif"],
            display: ["Plus Jakarta Sans", "sans-serif"],
            body: ["Plus Jakarta Sans", "sans-serif"],
            label: ["Plus Jakarta Sans", "sans-serif"]
          }
        },
      },
    }
  </script>
<style>
    body {
      background-color: #111214;
      color: #F7F6F3;
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      line-height: 1;
    }
  </style>
</head>
<body class="bg-bg text-text min-h-screen flex justify-center antialiased">
<!-- Mobile Device Simulation Frame (360x800 base proportion) -->
<div class="w-full max-w-[420px] min-h-screen flex flex-col bg-bg relative overflow-x-hidden">
<!-- Top App Bar (Task-focused editor screen: Back Navigation) -->
<header class="sticky top-0 z-30 flex items-center justify-between w-full px-5 py-3.5 h-16 bg-bg border-b border-border">
<button aria-label="Kembali" class="w-10 h-10 -ml-2 flex items-center justify-center rounded-full text-text hover:bg-surface-2 active:opacity-80 transition-colors" onclick="window.history.back()" type="button">
<span class="material-symbols-outlined text-[24px]" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="text-[18px] font-semibold leading-[26px] text-text tracking-normal text-center flex-1 pr-8">
        Atur Peningkatan
      </h1>
<div class="w-2"></div>
</header>
<!-- Scrollable Editor Canvas -->
<main class="flex-1 flex flex-col px-5 pt-3 pb-28 gap-5 overflow-y-auto">
<!-- HERO AREA: Photo Preview (~45% screen viewport) -->
<section class="flex flex-col items-center w-full">
<div class="w-full h-[340px] bg-surface rounded-[16px] overflow-hidden border border-border flex items-center justify-center relative">
<img alt="Foto pilihan keluarga lama untuk ditingkatkan kualitasnya" class="w-full h-full object-cover select-none pointer-events-none" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDCOii19jxR-WcShOoCq1N6f8zXsjI1-qVRXfJ00p7pHQpOO1gQfRTAr7jSvXi5-gIn1aBQyKx-paOkwV62M3HRgZdW6yd8oxqWlhbJDaWMoW7pJTldOY4U1sqPNna78EpqgGhTlmqKZJKXt65q2AWJ2MX4Bkai31mbO4nqveH_WPgQEt5ZK08iJx4Ag75fNRNUnMxd6poH9z0SI1iiTni7graoZFUosaYIknR5a0QwAlN4a54JgwwBjUNCKCjKGYCHs4Sr3Anh0lQ-"/>
</div>
<!-- Metadata Caption -->
<p class="mt-2.5 text-[12px] font-medium leading-[16px] text-text-2 tracking-wide text-center">
          1000 × 1000 · 1,2 MB
        </p>
</section>
<!-- Section: Preset -->
<section class="w-full">
<h2 class="text-[12px] font-medium leading-[16px] text-text-2 mb-2">
          Preset
        </h2>
<div aria-label="Preset Peningkatan" class="flex items-center gap-2 w-full" id="preset-group" role="radiogroup">
<!-- Cepat -->
<button aria-checked="false" class="preset-btn flex-1 h-[40px] rounded-full bg-surface-2 text-text font-medium text-[15px] leading-[22px] flex items-center justify-center active:opacity-80 transition-colors" onclick="selectPreset(this)" role="radio" type="button">
            Cepat
          </button>
<!-- Seimbang (SELECTED by default) -->
<button aria-checked="true" class="preset-btn flex-1 h-[40px] rounded-full bg-accent text-on-accent font-semibold text-[15px] leading-[22px] flex items-center justify-center active:opacity-80 transition-colors" onclick="selectPreset(this)" role="radio" type="button">
            Seimbang
          </button>
<!-- Maksimal -->
<button aria-checked="false" class="preset-btn flex-1 h-[40px] rounded-full bg-surface-2 text-text font-medium text-[15px] leading-[22px] flex items-center justify-center active:opacity-80 transition-colors" onclick="selectPreset(this)" role="radio" type="button">
            Maksimal
          </button>
</div>
</section>
<!-- Section: Skala -->
<section class="w-full">
<h2 class="text-[12px] font-medium leading-[16px] text-text-2 mb-2">
          Skala
        </h2>
<div aria-label="Skala Pembesaran" class="grid grid-cols-3 p-1 bg-surface border border-border rounded-[12px]" id="scale-group" role="radiogroup">
<!-- 2x (SELECTED by default) -->
<button aria-checked="true" class="scale-btn py-2 text-center text-[15px] font-semibold leading-[22px] bg-accent text-on-accent rounded-[8px] active:opacity-80 transition-colors" onclick="selectScale(this)" role="radio" type="button">
            2x
          </button>
<!-- 3x -->
<button aria-checked="false" class="scale-btn py-2 text-center text-[15px] font-medium leading-[22px] text-text rounded-[8px] hover:bg-surface-2 active:opacity-80 transition-colors" onclick="selectScale(this)" role="radio" type="button">
            3x
          </button>
<!-- 4x -->
<button aria-checked="false" class="scale-btn py-2 text-center text-[15px] font-medium leading-[22px] text-text rounded-[8px] hover:bg-surface-2 active:opacity-80 transition-colors" onclick="selectScale(this)" role="radio" type="button">
            4x
          </button>
</div>
</section>
<!-- Section: Collapsed Lanjutan -->
<section class="w-full">
<button aria-expanded="false" class="w-full bg-surface border border-border rounded-[16px] p-4 flex items-center justify-between text-left hover:bg-surface-2 active:opacity-80 transition-colors" id="advanced-toggle" onclick="toggleAdvanced()" type="button">
<div class="flex flex-col">
<span class="text-[15px] font-medium leading-[22px] text-text">Lanjutan</span>
<span class="text-[12px] font-medium leading-[16px] text-text-2 mt-0.5">Format, kualitas, GPU</span>
</div>
<span class="material-symbols-outlined text-[24px] text-text-2 transition-transform duration-200" data-icon="expand_more" id="advanced-chevron">expand_more</span>
</button>
<!-- Collapsible Content (Hidden initially) -->
<div class="hidden flex-col gap-3 mt-2 p-4 bg-surface border border-border rounded-[16px]" id="advanced-panel">
<div class="flex items-center justify-between text-[15px]">
<span class="text-text font-normal">Format Output</span>
<span class="text-text-2 text-[12px] font-medium px-2.5 py-1 bg-surface-2 rounded-full border border-border">PNG (Bawaan)</span>
</div>
<div class="h-px bg-border w-full"></div>
<div class="flex items-center justify-between text-[15px]">
<span class="text-text font-normal">Akselerasi Perangkat</span>
<span class="text-text-2 text-[12px] font-medium px-2.5 py-1 bg-surface-2 rounded-full border border-border">Otomatis</span>
</div>
</div>
</section>
</main>
<!-- BOTTOM PINNED: Single primary button container -->
<div class="fixed bottom-0 left-0 right-0 max-w-[420px] mx-auto z-40 px-5 pt-3 pb-6 bg-bg border-t border-border">
<button class="w-full h-[56px] rounded-[16px] bg-accent text-on-accent font-semibold text-[18px] leading-[26px] flex items-center justify-center active:opacity-90 active:scale-[0.99] transition-all" type="button">
        Tingkatkan
      </button>
</div>
</div>
<!-- Interactive Logic for Presets & Scale Selection -->
<script>
    function selectPreset(btn) {
      const buttons = document.querySelectorAll('.preset-btn');
      buttons.forEach(b => {
        b.classList.remove('bg-accent', 'text-on-accent', 'font-semibold');
        b.classList.add('bg-surface-2', 'text-text', 'font-medium');
        b.setAttribute('aria-checked', 'false');
      });
      btn.classList.remove('bg-surface-2', 'text-text', 'font-medium');
      btn.classList.add('bg-accent', 'text-on-accent', 'font-semibold');
      btn.setAttribute('aria-checked', 'true');
    }

    function selectScale(btn) {
      const buttons = document.querySelectorAll('.scale-btn');
      buttons.forEach(b => {
        b.classList.remove('bg-accent', 'text-on-accent', 'font-semibold');
        b.classList.add('text-text', 'font-medium');
        b.setAttribute('aria-checked', 'false');
      });
      btn.classList.remove('text-text', 'font-medium');
      btn.classList.add('bg-accent', 'text-on-accent', 'font-semibold');
      btn.setAttribute('aria-checked', 'true');
    }

    function toggleAdvanced() {
      const panel = document.getElementById('advanced-panel');
      const chevron = document.getElementById('advanced-chevron');
      const toggleBtn = document.getElementById('advanced-toggle');
      const isHidden = panel.classList.contains('hidden');

      if (isHidden) {
        panel.classList.remove('hidden');
        panel.classList.add('flex');
        chevron.style.transform = 'rotate(180deg)';
        toggleBtn.setAttribute('aria-expanded', 'true');
      } else {
        panel.classList.add('hidden');
        panel.classList.remove('flex');
        chevron.style.transform = 'rotate(0deg)';
        toggleBtn.setAttribute('aria-expanded', 'false');
      }
    }
  </script>
</body></html>
