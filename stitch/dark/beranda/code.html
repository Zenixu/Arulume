<!DOCTYPE html>

<html class="dark" lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Arulume — Beranda</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            bg: '#111214',
            surface: '#1B1C1F',
            'surface-2': '#25272B',
            border: '#2F3136',
            text: '#F7F6F3',
            'text-2': '#A4A7AE',
            accent: '#F5B83D',
            'on-accent': '#111214',
            'accent-text': '#F5B83D',
            success: '#6FCF97',
            danger: '#FF6B6B',
            warning: '#F2994A',
          },
          borderRadius: {
            DEFAULT: "0.5rem",
            sm: "12px",
            md: "16px",
            lg: "24px",
            xl: "1.5rem",
            full: "9999px"
          },
          fontFamily: {
            headline: ["Plus Jakarta Sans", "sans-serif"],
            display: ["Plus Jakarta Sans", "sans-serif"],
            body: ["Plus Jakarta Sans", "sans-serif"],
            label: ["Plus Jakarta Sans", "sans-serif"]
          }
        },
      },
    }
  </script>
<style>
    /* Strict Design System Reset for Flat Surface Design */
    * {
      box-shadow: none !important;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #111214;
      color: #F7F6F3;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 24;
      font-size: 22px;
      line-height: 1;
    }
    .material-symbols-outlined.icon-16 {
      font-size: 16px;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-bg text-text min-h-screen flex justify-center items-start antialiased selection:bg-surface-2 selection:text-accent">
<!-- Mobile Viewport Container: Fixed 360px portrait logic with 20px padding -->
<main class="w-full max-w-[360px] min-h-[800px] flex flex-col justify-between px-5 pt-3 pb-8 select-none">
<!-- SECTION 1: TOP BAR -->
<header class="flex justify-between items-center w-full h-16">
<div class="flex items-center gap-2.5">
<h1 class="font-headline text-2xl font-bold tracking-tight text-text leading-8">
          Arulume
        </h1>
<!-- Offline Pill Badge -->
<div class="inline-flex items-center gap-1 bg-surface-2 text-text-2 px-2.5 py-1 rounded-full text-xs font-medium border border-border">
<span class="material-symbols-outlined icon-16 text-text-2" data-icon="airplanemode_active">airplanemode_active</span>
<span class="tracking-tight text-[11px] leading-none">Offline</span>
</div>
</div>
<!-- Settings Action (48x48 dp touch target) -->
<button aria-label="Pengaturan" class="w-12 h-12 flex items-center justify-center rounded-full text-text-2 hover:text-text hover:bg-surface-2 transition-colors duration-150 active:opacity-80 focus:outline-none" type="button">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</header>
<!-- SECTION 2: CENTER SECTION (Mascot Aru + Copywriting) -->
<section class="flex flex-col items-center justify-center my-auto py-6">
<!-- Mascot: Aru (Sitting Cat Silhouette, Solid flat color, 160dp tall) -->
<div class="relative w-40 h-40 flex items-center justify-center mb-6">
<svg class="transition-transform duration-300 hover:scale-[1.02]" fill="none" height="160" viewbox="0 0 140 160" width="140" xmlns="http://www.w3.org/2000/svg">
<!-- Body and base posture -->
<ellipse cx="64" cy="118" fill="#1B1C1F" rx="42" ry="34" stroke="#2F3136" stroke-width="2"></ellipse>
<!-- Curved tail -->
<path d="M98 126C116 126 128 114 128 96C128 84 122 76 116 78C110 80 114 92 110 102C106 112 96 118 88 120" stroke="#1B1C1F" stroke-linecap="round" stroke-width="10"></path>
<path d="M98 126C116 126 128 114 128 96C128 84 122 76 116 78C110 80 114 92 110 102C106 112 96 118 88 120" fill="none" stroke="#2F3136" stroke-linecap="round" stroke-width="2"></path>
<!-- Head -->
<circle cx="64" cy="62" fill="#1B1C1F" r="32" stroke="#2F3136" stroke-width="2"></circle>
<!-- Left Ear -->
<polygon fill="#1B1C1F" points="40,48 30,16 56,36" stroke="#2F3136" stroke-linejoin="round" stroke-width="2"></polygon>
<!-- Right Ear -->
<polygon fill="#1B1C1F" points="72,36 98,16 88,48" stroke="#2F3136" stroke-linejoin="round" stroke-width="2"></polygon>
<!-- Cute Round White Eyes -->
<circle cx="52" cy="62" fill="#F7F6F3" r="4.5"></circle>
<circle cx="76" cy="62" fill="#F7F6F3" r="4.5"></circle>
<!-- Paws resting forward -->
<ellipse cx="50" cy="142" fill="#1B1C1F" rx="10" ry="7" stroke="#2F3136" stroke-width="1.75"></ellipse>
<ellipse cx="76" cy="142" fill="#1B1C1F" rx="10" ry="7" stroke="#2F3136" stroke-width="1.75"></ellipse>
</svg>
</div>
<!-- Headline & Tagline -->
<h2 class="font-headline text-2xl font-bold tracking-tight text-text text-center px-2">
        Kembalikan cahaya fotomu
      </h2>
<p class="font-body text-text-2 text-[15px] leading-[22px] text-center mt-2 font-normal">
        Semua diproses di HP. Tanpa unggah.
      </p>
</section>
<!-- SECTION 3: ACTIONS & RECENT FEED -->
<div class="flex flex-col gap-5 w-full mt-auto">
<!-- BUTTON CLUSTER -->
<div class="flex flex-col gap-3 w-full">
<!-- PRIMARY ACTION: Pilih Foto (56px, Amber, Dark text, flat) -->
<button class="w-full h-14 bg-accent hover:opacity-95 active:scale-[0.99] rounded-md flex items-center justify-center gap-2.5 transition-all duration-150 group" type="button">
<span class="material-symbols-outlined text-on-accent text-2xl" data-icon="add_photo_alternate">add_photo_alternate</span>
<span class="text-on-accent text-lg font-semibold tracking-tight">Pilih Foto</span>
</button>
<!-- SECONDARY ACTION: Pilih Video (52px, Surface, Bordered, Badge Segera) -->
<button class="w-full h-[52px] bg-surface border border-border rounded-md px-4 flex items-center justify-between opacity-80 cursor-default" disabled="" type="button">
<div class="flex items-center gap-2.5">
<span class="material-symbols-outlined text-text-2 text-xl" data-icon="videocam">videocam</span>
<span class="text-text text-[15px] font-medium tracking-tight">Pilih Video</span>
</div>
<span class="bg-surface-2 text-text-2 font-headline text-xs font-medium px-2 py-0.5 rounded-full border border-border">
            Segera
          </span>
</button>
</div>
<!-- SECTION 4: RECENT / TERBARU EMPTY STATE -->
<div class="flex flex-col gap-2 pt-1">
<div class="flex items-center justify-between">
<span class="text-text-2 text-xs font-medium uppercase tracking-wider">
            Terbaru
          </span>
</div>
<!-- Empty state row with Aru peek silhouette -->
<div class="bg-surface border border-border rounded-sm p-3.5 flex items-center gap-3.5">
<!-- Peeking cat face silhouette -->
<div class="w-10 h-10 rounded-sm bg-surface-2 border border-border flex items-center justify-center shrink-0">
<svg fill="none" height="24" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
<path d="M4 17C4 12 7.5 8 12 8C16.5 8 20 12 20 17" fill="#111214"></path>
<polygon fill="#111214" points="5,11 3,5 9,8"></polygon>
<polygon fill="#111214" points="19,11 21,5 15,8"></polygon>
<circle cx="9.5" cy="12" fill="#F7F6F3" r="1.25"></circle>
<circle cx="14.5" cy="12" fill="#F7F6F3" r="1.25"></circle>
</svg>
</div>
<div class="flex flex-col">
<span class="text-text-2 text-sm font-normal">Belum ada cerita</span>
<span class="text-text-2 text-[11px] opacity-60">Foto yang diproses akan muncul di sini</span>
</div>
</div>
</div>
</div>
</main>
<script>
    // Subtle touch feedback for mobile screen simulation
    document.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('touchstart', () => {}, { passive: true });
    });
  </script>
</body></html>
