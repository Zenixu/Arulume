<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Error - Arulume</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: '#F7F6F3',
            surface: '#FFFFFF',
            'surface-2': '#EFEDE8',
            border: '#E2DFD8',
            text: '#111214',
            'text-2': '#5B5E66',
            amber: '#F5B83D'
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: #F7F6F3;
      color: #111214;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      margin: 0;
      padding: 0;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 350, 'GRAD' 0, 'opsz' 24;
    }
    * {
      box-sizing: border-box;
      box-shadow: none !important;
    }
  </style>
</head>
<body class="bg-bg min-h-screen flex items-center justify-center p-0 selection:bg-amber selection:text-text">
  <!-- Mobile Container Android 360x800 portrait simulation -->
  <div class="w-full max-w-[360px] min-h-[800px] h-[800px] bg-bg flex flex-col justify-between relative mx-auto border-x border-border overflow-hidden select-none">
    
    <!-- Top App Bar / Header -->
    <header class="w-full h-14 bg-surface border-b border-border px-5 flex items-center justify-between shrink-0 z-10">
      <div class="flex items-center gap-3">
        <button class="w-9 h-9 -ml-2 rounded-full flex items-center justify-center text-text hover:bg-surface-2 active:bg-surface-2 transition-colors">
          <span class="material-symbols-outlined text-[22px] leading-none" style="font-variation-settings: 'wght' 350;">close</span>
        </button>
        <span class="font-bold text-[18px] tracking-tight text-text">Arulume</span>
      </div>
      
      <!-- Offline Pill Badge -->
      <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-surface-2 border border-border text-[12px] font-medium text-text-2">
        <span class="material-symbols-outlined text-[14px] leading-none" style="font-variation-settings: 'wght' 350;">flight</span>
        <span>Offline</span>
      </div>
    </header>

    <!-- Center Error Content Area -->
    <main class="flex-1 flex flex-col items-center justify-center px-5 py-6 text-center">
      
      <!-- Minimal Solid Black Cat Mascot (approx 96dp / 96px) with Question Mark -->
      <div class="relative w-24 h-24 mb-6 flex items-center justify-center">
        <svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" class="shrink-0">
          <!-- Cat body & paws sitting silhouette -->
          <ellipse cx="48" cy="68" rx="26" ry="18" fill="#111214" />
          <!-- Tail curving upward to the left -->
          <path d="M26 69C18 69 13 60 16 52C17 48 20 46 23 48C25 50 24 53 23 55C21 59 23 63 28 63C31 63 33 65 33 67C33 69 30 69 26 69Z" fill="#111214" />
          <!-- Cat Head & pointed ears -->
          <path d="M28 39L23 20C27 21 34 25 38 27C44 25.5 52 25.5 58 27C62 25 69 21 73 20L68 39C74 46 72 58 64 64C56 70 40 70 32 64C24 58 22 46 28 39Z" fill="#111214" />
          <!-- Big round white eyes (confused wide stare) -->
          <circle cx="39" cy="45" r="5" fill="#FFFFFF" />
          <circle cx="57" cy="45" r="5" fill="#FFFFFF" />
          <!-- Small pupils (slightly off-center for bewildered look) -->
          <circle cx="40" cy="45" r="2.2" fill="#111214" />
          <circle cx="58" cy="45" r="2.2" fill="#111214" />
          <!-- Nose & mouth hints -->
          <path d="M47 50L49 50L48 51.5Z" fill="#FFFFFF" fill-opacity="0.7"/>
          <path d="M45.5 53.5C46.8 54.5 49.2 54.5 50.5 53.5" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="1.2" stroke-linecap="round"/>
        </svg>

        <!-- Small question mark floating beside head -->
        <span class="absolute -top-1 -right-2 font-bold text-amber text-[26px] leading-none select-none font-sans" style="transform: rotate(12deg);">?</span>
      </div>

      <!-- Headline: heading 18/600 -->
      <h1 class="text-[18px] leading-[26px] font-semibold text-text mb-2 max-w-[280px]">
        Foto ini terlalu besar
      </h1>

      <!-- Secondary Body: two lines, secondary color #5B5E66, text size 15 -->
      <p class="text-[15px] leading-[22px] font-normal text-text-2 max-w-[280px] mb-8">
        Foto ini terlalu besar untuk 4x.<br>
        Coba 2x atau perkecil fotonya.
      </p>

      <!-- Action Buttons Container (full width with 20dp/px side margins) -->
      <div class="w-full flex flex-col items-center gap-3">
        <!-- Full-width amber primary button height 56dp -->
        <button class="w-full h-14 bg-amber hover:opacity-95 active:opacity-90 transition-opacity rounded-xl flex items-center justify-center px-4 font-semibold text-[15px] text-text">
          Coba lagi
        </button>

        <!-- Secondary Text Button 'Ubah pengaturan' in amber -->
        <button class="h-11 px-4 flex items-center justify-center font-semibold text-[15px] text-amber hover:opacity-85 active:opacity-75 transition-opacity">
          Ubah pengaturan
        </button>
      </div>

    </main>

    <!-- Footer / Tiny Error Code at Very Bottom (caption 12dp) -->
    <footer class="pb-6 pt-2 text-center shrink-0">
      <span class="text-[12px] leading-none font-normal tracking-wider text-text-2/70 uppercase font-mono">
        E_INPUT_TOO_LARGE
      </span>
    </footer>

  </div>
</body>
</html>
