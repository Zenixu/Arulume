<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onboarding - Arulume</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #F7F6F3;
      color: #111214;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .device {
      width: 360px;
      height: 800px;
      background-color: #FFFFFF;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 0;
      overflow: hidden;
      border: 1px solid #E2DFD8;
    }

    /* Top mascot & hero area */
    .hero-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 36px;
      padding-left: 20px;
      padding-right: 20px;
      text-align: center;
    }

    .mascot-container {
      width: 200px;
      height: 190px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .mascot-svg {
      width: 170px;
      height: 170px;
    }

    .title {
      font-size: 24px;
      line-height: 30px;
      font-weight: 700;
      color: #111214;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 15px;
      line-height: 22px;
      font-weight: 400;
      color: #5B5E66;
      max-width: 290px;
    }

    /* Features list */
    .features-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 0 20px;
      margin-top: 24px;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .icon-circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #EFEDE8;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon-circle svg {
      width: 20px;
      height: 20px;
      stroke: #F5B83D;
      stroke-width: 1.75;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .feature-text {
      font-size: 15px;
      line-height: 20px;
      font-weight: 500;
      color: #111214;
    }

    /* Bottom action & pagination area */
    .bottom-section {
      padding: 0 20px 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* Dots indicator */
    .dots-container {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #E2DFD8;
    }

    .dot.active {
      width: 18px;
      height: 6px;
      border-radius: 3px;
      background-color: #F5B83D;
    }

    .btn-primary {
      width: 100%;
      height: 56px;
      background-color: #F5B83D;
      color: #111214;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.15s ease;
    }

    .btn-primary:active {
      opacity: 0.88;
    }

    .btn-skip {
      background: none;
      border: none;
      color: #5B5E66;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      padding: 4px 8px;
      text-decoration: none;
    }

    .btn-skip:active {
      color: #111214;
    }
  </style>
</head>
<body>
  <div class="device">
    <!-- Top & Content Area -->
    <div style="display: flex; flex-direction: column;">
      <div class="hero-section">
        <!-- Mascot Arulume: Solid black cat waving with tiny sparkle -->
        <div class="mascot-container">
          <svg class="mascot-svg" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Sparkle top right -->
            <path d="M132 28 C132 34 136 38 142 38 C136 38 132 42 132 48 C132 42 128 38 122 38 C128 38 132 34 132 28 Z" fill="#F5B83D"/>
            <!-- Tiny sparkle dot -->
            <circle cx="118" cy="22" r="1.5" fill="#F5B83D"/>
            
            <!-- Tail -->
            <path d="M48 116 C34 116 28 98 34 86 C37 80 43 78 45 84 C47 90 41 94 40 100 C39 106 43 110 50 110 Z" fill="#111214"/>
            
            <!-- Body -->
            <path d="M50 134 C50 96 60 84 80 84 C100 84 110 96 110 134 C110 142 50 142 50 134 Z" fill="#111214"/>
            
            <!-- Head & Ears -->
            <!-- Left ear: 52,60 to 58,26 to 74,48 -->
            <!-- Right ear: 86,48 to 102,26 to 108,60 -->
            <path d="M52 58 L57 26 C58 23 62 24 64 27 L75 46 C77 45 83 45 85 46 L96 27 C98 24 102 23 103 26 L108 58 C116 68 116 84 106 94 C96 102 64 102 54 94 C44 84 44 68 52 58 Z" fill="#111214"/>
            
            <!-- Eyes (Curious, wide) -->
            <ellipse cx="69" cy="67" rx="7.5" ry="9" fill="#FFFFFF"/>
            <circle cx="70" cy="67" r="4.2" fill="#111214"/>
            <circle cx="68" cy="64" r="1.6" fill="#FFFFFF"/>
            
            <ellipse cx="91" cy="67" rx="7.5" ry="9" fill="#FFFFFF"/>
            <circle cx="90" cy="67" r="4.2" fill="#111214"/>
            <circle cx="88" cy="64" r="1.6" fill="#FFFFFF"/>
            
            <!-- Nose & mouth -->
            <polygon points="80,74 78,76.5 82,76.5" fill="#EFEDE8"/>
            <path d="M76.5 78.5 C78 79.5 80 79.5 80 78.5 C80 79.5 82 79.5 83.5 78.5" stroke="#EFEDE8" stroke-width="1.2" stroke-linecap="round" fill="none"/>
            
            <!-- Waving Paw (Right hand raised waving playfully) -->
            <path d="M102 96 C106 88 115 72 124 60 C128 55 134 59 130 65 C122 78 114 96 108 106 Z" fill="#111214"/>
            <!-- Paw pad / rounded end -->
            <circle cx="127" cy="61" r="5.5" fill="#111214"/>
            <ellipse cx="126" cy="60" rx="2.5" ry="2" fill="#111214"/>
            
            <!-- Left front paw resting on chest -->
            <path d="M58 98 C56 106 62 112 68 112 C74 112 76 106 74 98 Z" fill="#111214"/>
          </svg>
        </div>

        <h1 class="title">Offline & privat</h1>
        <p class="subtitle">Fotomu tidak pernah keluar dari HP ini.</p>
      </div>

      <!-- Feature Rows -->
      <div class="features-list">
        <!-- Feature 1: Tanpa internet, tanpa akun (Cloud-off / No globe) -->
        <div class="feature-item">
          <div class="icon-circle">
            <svg viewBox="0 0 24 24">
              <!-- Outline cloud off / no internet -->
              <path d="M2 2l20 20M9.5 4.5A6.5 6.5 0 0 1 18 10a5 5 0 0 1 4 4.9c0 .7-.1 1.4-.4 2M4.9 5A6.5 6.5 0 0 0 3 10a5 5 0 0 0 5 5h10.2"/>
            </svg>
          </div>
          <span class="feature-text">Tanpa internet, tanpa akun</span>
        </div>

        <!-- Feature 2: Semua diproses di HP (Smartphone / Processor on device) -->
        <div class="feature-item">
          <div class="icon-circle">
            <svg viewBox="0 0 24 24">
              <!-- Smartphone with internal chip / check -->
              <rect x="5" y="2" width="14" height="20" rx="3"/>
              <circle cx="12" cy="18" r="1" fill="#F5B83D"/>
              <path d="M9 9h6M9 12h3"/>
            </svg>
          </div>
          <span class="feature-text">Semua diproses di HP</span>
        </div>

        <!-- Feature 3: Hasil langsung ke galeri (Image / Gallery download) -->
        <div class="feature-item">
          <div class="icon-circle">
            <svg viewBox="0 0 24 24">
              <!-- Gallery photo with checkmark -->
              <rect x="3" y="3" width="18" height="18" rx="3"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <path d="M21 15l-5-5L5 21"/>
            </svg>
          </div>
          <span class="feature-text">Hasil langsung ke galeri</span>
        </div>
      </div>
    </div>

    <!-- Bottom Actions -->
    <div class="bottom-section">
      <!-- 3 page dots with first amber -->
      <div class="dots-container">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>

      <!-- Full-width primary amber CTA -->
      <button class="btn-primary" type="button">Mulai</button>

      <!-- Tiny text button Lewati -->
      <button class="btn-skip" type="button">Lewati</button>
    </div>
  </div>
</body>
</html>
