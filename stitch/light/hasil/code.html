<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hasil - Arulume</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #F7F6F3;
      color: #111214;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
      stroke-width: 0;
    }
    /* Slider interactive styling */
    .comparison-container {
      position: relative;
      user-select: none;
      touch-action: pan-y;
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-[#F7F6F3] text-[#111214] flex justify-center min-h-screen">
  <div class="w-full max-w-[360px] min-h-[800px] flex flex-col bg-[#F7F6F3] relative pb-6 select-none">
    
    <!-- Top Bar -->
    <header class="h-14 flex items-center px-5 border-b border-[#E2DFD8] bg-[#FFFFFF] sticky top-0 z-30">
      <button class="w-9 h-9 -ml-2 flex items-center justify-center text-[#111214] hover:bg-[#EFEDE8] rounded-full transition-colors active:opacity-70" aria-label="Kembali">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111214" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </button>
      <h1 class="ml-2 text-[18px] font-semibold text-[#111214] leading-[26px]">Hasil</h1>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col px-5 pt-4">
      
      <!-- HERO: Before / After Slider (~70% of screen height in relative visual weight / 460px high) -->
      <div id="sliderWrapper" class="comparison-container w-full h-[450px] rounded-[16px] border border-[#E2DFD8] bg-[#EFEDE8] relative shadow-none">
        
        <!-- After Image (Sharp: right layer / full background) -->
        <div class="absolute inset-0 w-full h-full overflow-hidden rounded-[16px]">
          <img src="https://lh3.googleusercontent.com/aida/AEtjO1XGA4oLo-lfv_TWKBcYbB4A3CxblToByq_8B-m82zbucbakV1okgsjgIpfZGHNs02_hKhBdOfUS-fnf9f3uPoaVJcdl6qKF2N8OjY7BxlGRdDmj2uLUuVloijqpbbbQc-zrBCUMfBuVPXhhYyLDuslbJEjwng1r8ABvFeBDmJpK5QvzA8E0OAqYcPZfR8d0BkD77OSSiID0eFCAyDaWrtmW3FQJLwf3wRcAcZHTKm_912pviLrgBzo76huO" alt="Foto Hasil Pertajam" class="w-full h-full object-cover select-none pointer-events-none filter contrast-[1.12] brightness-[1.03] saturate-[1.05]" />
          
          <!-- Label Hasil (Bottom Right) -->
          <div class="absolute bottom-3 right-3 bg-[#111214]/65 backdrop-blur-sm text-[#FFFFFF] text-[12px] font-medium px-2.5 py-1 rounded-md tracking-wide pointer-events-none z-10">
            Hasil
          </div>
        </div>

        <!-- Before Image (Blurry: left overlay layer clipped) -->
        <div id="beforeLayer" class="absolute inset-y-0 left-0 w-[50%] h-full overflow-hidden rounded-l-[16px] z-10">
          <div class="w-[320px] h-[450px] relative">
            <img src="https://lh3.googleusercontent.com/aida/AEtjO1XGA4oLo-lfv_TWKBcYbB4A3CxblToByq_8B-m82zbucbakV1okgsjgIpfZGHNs02_hKhBdOfUS-fnf9f3uPoaVJcdl6qKF2N8OjY7BxlGRdDmj2uLUuVloijqpbbbQc-zrBCUMfBuVPXhhYyLDuslbJEjwng1r8ABvFeBDmJpK5QvzA8E0OAqYcPZfR8d0BkD77OSSiID0eFCAyDaWrtmW3FQJLwf3wRcAcZHTKm_912pviLrgBzo76huO" alt="Foto Asli Buram" class="absolute top-0 left-0 w-full h-full object-cover select-none pointer-events-none filter blur-[2.5px] contrast-[0.92] brightness-[0.96]" />
          </div>
          
          <!-- Label Asli (Bottom Left) -->
          <div class="absolute bottom-3 left-3 bg-[#111214]/65 backdrop-blur-sm text-[#FFFFFF] text-[12px] font-medium px-2.5 py-1 rounded-md tracking-wide pointer-events-none">
            Asli
          </div>
        </div>

        <!-- Divider Line with 40dp Handle -->
        <div id="sliderDivider" class="absolute inset-y-0 left-[50%] -translate-x-1/2 z-20 flex items-center justify-center pointer-events-none">
          <!-- Thin amber vertical line -->
          <div class="w-[2px] h-full bg-[#F5B83D]"></div>
          
          <!-- Round 40dp Handle -->
          <div class="absolute w-[40px] h-[40px] rounded-full bg-[#F5B83D] flex items-center justify-center pointer-events-auto cursor-ew-resize active:scale-95 transition-transform" style="box-shadow: 0 0 0 2px #FFFFFF;">
            <!-- Double arrow indicator in outline stroke 1.75 -->
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111214" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 16 5 12 9 8"></polyline>
              <polyline points="15 8 19 12 15 16"></polyline>
            </svg>
          </div>
        </div>

      </div>

      <!-- Info Meta & Success Status Row -->
      <div class="mt-3.5 flex items-center justify-between">
        <span class="text-[12px] text-[#5B5E66] font-normal tracking-tight">
          2000 × 2000 · 14 detik
        </span>
        
        <div class="flex items-center gap-1.5 bg-[#FFFFFF] px-2.5 py-1 rounded-full border border-[#E2DFD8]">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#28784B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span class="text-[12px] font-medium text-[#111214]">Tersimpan di Galeri</span>
        </div>
      </div>

      <!-- ACTIONS SECTION -->
      <div class="mt-5 flex flex-col gap-2.5">
        <!-- Two secondary buttons -->
        <div class="grid grid-cols-2 gap-2.5">
          <!-- Bagikan -->
          <button class="h-[48px] rounded-[16px] bg-[#FFFFFF] border border-[#E2DFD8] text-[#111214] text-[15px] font-medium flex items-center justify-center gap-2 hover:bg-[#EFEDE8] active:bg-[#E2DFD8] transition-colors" type="button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111214" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="18" cy="5" r="3"></circle>
              <circle cx="6" cy="12" r="3"></circle>
              <circle cx="18" cy="19" r="3"></circle>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
              <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
            </svg>
            <span>Bagikan</span>
          </button>

          <!-- Buka di Galeri -->
          <button class="h-[48px] rounded-[16px] bg-[#FFFFFF] border border-[#E2DFD8] text-[#111214] text-[15px] font-medium flex items-center justify-center gap-2 hover:bg-[#EFEDE8] active:bg-[#E2DFD8] transition-colors" type="button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111214" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></polyline>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            <span class="truncate">Buka Galeri</span>
          </button>
        </div>

        <!-- Text button: Tingkatkan Lagi -->
        <div class="flex justify-center pt-1 pb-0.5">
          <button class="text-[#8E6200] hover:text-[#111214] text-[15px] font-semibold py-1 px-3 transition-colors active:opacity-75" type="button">
            Tingkatkan Lagi
          </button>
        </div>

        <!-- Full-width Amber Primary Button: Selesai -->
        <button class="w-full h-[56px] rounded-[16px] bg-[#F5B83D] text-[#111214] text-[15px] font-semibold flex items-center justify-center hover:brightness-95 active:brightness-90 transition-all" type="button">
          Selesai
        </button>
      </div>

    </main>
  </div>

  <!-- Interactive draggable slider script -->
  <script>
    (function() {
      const container = document.getElementById('sliderWrapper');
      const beforeLayer = document.getElementById('beforeLayer');
      const divider = document.getElementById('sliderDivider');
      if (!container || !beforeLayer || !divider) return;

      let isDragging = false;

      function updatePosition(x) {
        const rect = container.getBoundingClientRect();
        let posX = x - rect.left;
        if (posX < 0) posX = 0;
        if (posX > rect.width) posX = rect.width;
        
        const pct = (posX / rect.width) * 100;
        beforeLayer.style.width = pct + '%';
        divider.style.left = pct + '%';
      }

      function onPointerMove(e) {
        if (!isDragging) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        updatePosition(clientX);
      }

      function onPointerUp() {
        isDragging = false;
        window.removeEventListener('mousemove', onPointerMove);
        window.removeEventListener('mouseup', onPointerUp);
        window.removeEventListener('touchmove', onPointerMove);
        window.removeEventListener('touchend', onPointerUp);
      }

      function onPointerDown(e) {
        isDragging = true;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        updatePosition(clientX);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);
        window.addEventListener('touchmove', onPointerMove, { passive: true });
        window.addEventListener('touchend', onPointerUp);
      }

      container.addEventListener('mousedown', onPointerDown);
      container.addEventListener('touchstart', onPointerDown, { passive: true });
    })();
  </script>
</body>
</html>
