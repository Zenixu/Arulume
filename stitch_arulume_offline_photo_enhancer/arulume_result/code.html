<script>
  (function initSlider() {
    const root = document.getElementById('slider-root');
    const beforeLayer = document.getElementById('before-image-layer');
    const divider = document.getElementById('divider-bar');
    if (!root || !beforeLayer || !divider) return;

    let isDragging = false;

    function updatePosition(clientX) {
      const rect = root.getBoundingClientRect();
      const x = Math.max(0, Math.min(clientX - rect.left, rect.width));
      const percentage = (x / rect.width) * 100;
      beforeLayer.style.width = percentage + '%';
      divider.style.left = percentage + '%';
    }

    root.addEventListener('pointerdown', (e) => {
      isDragging = true;
      root.setPointerCapture(e.pointerId);
      updatePosition(e.clientX);
    });

    root.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      updatePosition(e.clientX);
    });

    const stopDragging = (e) => {
      if (isDragging) {
        isDragging = false;
        try { root.releasePointerCapture(e.pointerId); } catch (_) {}
      }
    };

    root.addEventListener('pointerup', stopDragging);
    root.addEventListener('pointercancel', stopDragging);
  })();
