<!-- Micro-interaction script to subtly animate progress bar progression naturally -->
<script>
    (function() {
      let progress = 62;
      const progressFill = document.getElementById('progress-fill');
      const percentVal = document.getElementById('percent-val');
      const subStatus = document.getElementById('sub-status');
      const btnCancel = document.getElementById('btn-cancel');

      const interval = setInterval(() => {
        if (progress < 94) {
          progress += 2;
          if (progressFill) progressFill.style.width = progress + '%';
          if (percentVal) percentVal.textContent = progress + '%';

          if (progress > 78 && subStatus) {
            subStatus.textContent = 'Menghaluskan tekstur tonal · ~2 dtk tersisa';
          }
          if (progress > 88 && subStatus) {
            subStatus.textContent = 'Menyelesaikan rekonstruksi · ~1 dtk tersisa';
          }
        } else {
          clearInterval(interval);
        }
      }, 700);

      if (btnCancel) {
        btnCancel.addEventListener('click', () => {
          if (subStatus) subStatus.textContent = 'Membatalkan proses...';
          btnCancel.classList.add('opacity-60', 'pointer-events-none');
          setTimeout(() => {
            if (window.history && window.history.length > 1) {
              window.history.back();
            }
          }, 350);
        });
      }
    })();
  </script>
