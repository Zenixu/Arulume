apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Kunci rilis TIDAK boleh masuk repo (Docs/AGENTS.md aturan #9). Berkasnya
// dibaca dari luar proyek: ~/.arulume/release.properties. Kalau tidak ada,
// build rilis memakai kunci debug supaya `assembleRelease` tetap bisa jalan.
def propsRilis = new Properties()
def berkasRilis = new File(System.getProperty("user.home"), ".arulume/release.properties")
if (berkasRilis.exists()) {
    berkasRilis.withInputStream { propsRilis.load(it) }
}
def adaKunciRilis = berkasRilis.exists() && propsRilis.getProperty("storeFile") != null

android {
    namespace = "id.aruthtale.arulume"
    compileSdk = rootProject.ext.compileSdkVersion
    ndkVersion "28.2.13676358"
    defaultConfig {
        applicationId "id.aruthtale.arulume"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 4
        versionName "0.1.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }

        // Hanya arm64-v8a (Docs/ARCHITECTURE.md bagian 11) — memperkecil APK.
        ndk {
            abiFilters "arm64-v8a"
        }

        // ncnn + JNI (Docs/ARCHITECTURE.md bagian 6, Fase 0.4).
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
                cppFlags "-O3 -fno-finite-math-only"
            }
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
    signingConfigs {
        rilis {
            if (adaKunciRilis) {
                storeFile file(propsRilis.getProperty("storeFile"))
                storePassword propsRilis.getProperty("storePassword")
                keyAlias propsRilis.getProperty("keyAlias")
                keyPassword propsRilis.getProperty("keyPassword")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Bertanda tangan kunci rilis bila tersedia; kalau tidak, debug.
            signingConfig adaKunciRilis ? signingConfigs.rilis : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = "21"
    }
    buildFeatures {
        buildConfig = true
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Orientasi EXIF saat membaca foto pengguna (Docs/AGENTS.md #5, PRD FR-01).
    implementation "androidx.exifinterface:exifinterface:1.3.7"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Plugin google-services (FCM) sengaja TIDAK dipasang: notifikasi Arulume dibuat lokal
// lewat ProsesNotif.kt. FCM butuh izin INTERNET, dilarang Docs/AGENTS.md aturan 1.
